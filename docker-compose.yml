x-openclaw-env: &openclaw-env
  HOME: /home/node
  TERM: xterm-256color
  OPENCLAW_CONFIG_PATH: /openclaw.json

x-openclaw-volumes: &openclaw-volumes
  # - /var/run/docker.sock:/var/run/docker.sock   # WARNING: install Docker and Docker Compose inside container to use
  - /etc/timezone:/etc/timezone:ro
  - /etc/localtime:/etc/localtime:ro
  - ./_data:/home/node/.openclaw:rw
  - ./openclaw.json:/openclaw.json:rw             # https://docs.openclaw.ai/gateway/configuration-reference

services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    user: root                                    # Avoid Error: EACCES: permission denied, mkdir '/home/node/.openclaw/devices'
    env_file:
      - path: ./.env
        required: true
      - path: ./agent.env                         # DEPLOYMENT ENV
        required: false
    environment:
      <<: *openclaw-env
    volumes: *openclaw-volumes
    ports:
      - "18789:18789"
      - "18790:18790"
    init: true
    restart: unless-stopped
    command: ["node", "dist/index.js", "gateway", "--bind", "${OPENCLAW_GATEWAY_BIND:-lan}", "--port", "18789", "--allow-unconfigured"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
